<!doctype html><html lang="zh-TW"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>月看月對稱｜鏡像補圖生成器</title><style>
:root{--navy:#17324d;--coral:#ef775f;--gold:#c69a45;--ink:#26394a}*{box-sizing:border-box}body{margin:0;background:#e8edf0;color:var(--ink);font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif}button,select{font:inherit}main{min-height:100vh;padding:28px}.panel{max-width:1120px;margin:0 auto 24px;background:var(--navy);color:#fff;border-radius:24px;padding:24px 28px;box-shadow:0 14px 36px #17324d30}.brand{display:flex;gap:16px;align-items:center}.moon{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:#f6d88d;color:var(--navy);font-size:42px}.brand p{margin:0;color:#f3d99b;font-size:14px;letter-spacing:.12em}.brand h1{display:inline;margin:0;font-size:30px}.brand b{margin-left:12px;color:#d9e5ed;font-weight:500}.controls{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-top:20px}label{font-size:14px;font-weight:700}select{width:100%;margin-top:8px;padding:12px;border:0;border-radius:12px;color:var(--navy);background:#fff;font-size:16px;font-weight:700}.actions{display:flex;justify-content:flex-end;gap:12px;margin-top:18px}button{border:0;border-radius:999px;padding:12px 22px;cursor:pointer;font-weight:800}.primary{background:var(--coral);color:#fff;box-shadow:0 5px 0 #b84e3c}.secondary{background:#fff;color:var(--navy)}.tip{text-align:right;color:#cbd9e2;font-size:13px}
.worksheet{position:relative;width:210mm;height:297mm;margin:auto;padding:12mm 13mm 9mm;background:#fffdf8;box-shadow:0 10px 30px #20304025;display:flex;flex-direction:column;overflow:hidden}.header{position:relative;z-index:2;display:flex;justify-content:space-between;border-bottom:3px solid var(--coral);padding:0 13mm 5mm 0}.header h2{margin:2px 0 3px;color:var(--navy);font-size:28px}.header p{margin:0;font-size:14px}.identity{display:flex;flex-direction:column;gap:11px;padding-top:5px;font-size:14px}.corner{position:absolute;right:8mm;top:5mm;color:var(--gold);font-size:38px}.corner i{font-size:12px;font-style:normal}.pagewm{position:absolute;inset:0;opacity:.035;color:var(--navy);pointer-events:none}.pagewm span{position:absolute;font-size:180px;left:17mm;top:95mm}.pagewm i{position:absolute;font-style:normal;font-size:75px;right:19mm;top:93mm}.grid{position:relative;z-index:1;flex:1;display:grid;gap:5mm;padding:6mm 0 3mm}.count1 .grid{grid-template-columns:1fr}.count4 .grid{grid-template:repeat(2,1fr)/repeat(2,1fr)}.count9 .grid{grid-template:repeat(3,1fr)/repeat(3,1fr);gap:3mm}.exercise{min-height:0;position:relative;border:1.5px solid #d9d2c2;border-radius:14px;padding:9mm 7mm 4mm;background:#ffffffd9;display:flex;flex-direction:column;align-items:center}.etitle{position:absolute;left:6mm;top:4mm;font-weight:800;color:var(--navy);font-size:15px}.etitle span{display:inline-grid;place-items:center;width:23px;height:23px;border-radius:50%;background:var(--coral);color:#fff;margin-right:5px}.exercise svg{width:100%;flex:1;min-height:0;margin-top:5mm}.dot{fill:#9ea9ad}.axis{stroke:var(--gold);stroke-width:1.35;stroke-dasharray:3 2}.line{fill:none;stroke:var(--navy);stroke-width:2.3;stroke-linecap:round;stroke-linejoin:round}.start{fill:#3eaa78;stroke:#fff;stroke-width:.7}.st{fill:#267652;font-size:4px;font-weight:800}.label{color:#677985;font-size:12px}.count4 .exercise{padding:9mm 3mm 3mm}.count4 .etitle{font-size:11px;left:3mm}.count9 .exercise{padding:7mm 1.5mm 1.5mm;border-radius:9px}.count9 .etitle{font-size:8px;left:2mm;top:2mm}.count9 .etitle span{width:15px;height:15px}.count9 .label{font-size:8px}footer{z-index:2;border-top:1px solid #d9d2c2;padding-top:3mm;display:flex;justify-content:space-between;color:#7c6742;font-size:11px;font-weight:700}
@media(max-width:850px){main{padding:14px}.panel{padding:20px}.controls{grid-template-columns:1fr 1fr}.worksheet{transform-origin:top left;transform:scale(calc((100vw - 28px)/793.7));margin:0;margin-bottom:calc(-297mm + ((100vw - 28px)/793.7*1122.5px))}}@media print{@page{size:A4 portrait;margin:0}body{background:#fff}main{padding:0}.panel{display:none}.worksheet{margin:0;box-shadow:none;transform:none}}
</style></head><body><main><section class="panel"><div class="brand"><div class="moon">☾</div><div><p>樂齡視覺空間認知練習</p><h1>月看月對稱</h1><b>鏡像補圖生成器</b></div></div><div class="controls">
<label>鏡像方向<select id="direction"><option value="vertical">左右對稱</option><option value="horizontal">上下倒影</option></select></label>
<label>主題種類<select id="category"><option value="nature">自然</option><option value="life">生活</option><option value="geometry">幾何</option></select></label>
<label>長輩程度<select id="difficulty"><option value="challenge">挑戰級・6×6格點</option><option value="advanced">進階級・無點陣提示</option></select></label>
<label>A4每張題數<select id="count"><option value="1">1題・最大圖</option><option value="4">4題</option><option value="9">9題</option></select></label></div><div class="actions"><button class="secondary" id="refresh">↻ 換一組不重複題目</button><button class="primary" onclick="print()">列印 A4 練習單</button></div><p class="tip">同一張內的圖案不重複；列印時只保留練習表。</p></section>
<section class="worksheet count1" id="sheet"><div class="corner">☾<i>✦</i></div><div class="pagewm"><span>☾</span><i>✦</i></div><header class="header"><div><h2>月看月對稱</h2><p>觀察已完成的一半，畫出鏡像圖形。</p></div><div class="identity"><span>姓名：________________</span><span>日期：______年____月____日</span></div></header><div class="grid" id="grid"></div><footer><span id="foot"></span><span>觀察・定位・完成</span></footer></section></main><script>
const P={nature:[['花朵',[[50,50],[40,41],[32,27],[24,37],[35,51],[22,62],[36,69],[41,86],[50,92]]],['葉片',[[50,88],[39,75],[28,58],[20,38],[27,21],[42,32],[50,48]]],['蝴蝶',[[50,17],[39,27],[24,20],[17,35],[30,49],[14,63],[27,80],[41,70],[50,84]]],['樹冠',[[50,87],[39,75],[42,63],[27,59],[33,47],[20,39],[32,26],[44,30],[50,16]]],['雪花',[[50,11],[50,50],[31,30],[50,50],[18,50],[50,50],[31,70],[50,50],[50,89]]],['魚尾',[[50,29],[39,22],[24,29],[34,50],[19,71],[39,77],[50,70]]],['山峰',[[50,84],[38,65],[30,73],[19,49],[31,26],[41,42],[50,16]]],['雲朵',[[50,70],[39,76],[27,68],[30,56],[18,48],[24,34],[39,35],[43,23],[50,27]]],['松果',[[50,14],[39,27],[45,39],[31,50],[44,61],[35,75],[50,89]]]],life:[['花瓶',[[50,15],[37,15],[35,29],[42,38],[30,53],[27,75],[34,88],[50,90]]],['愛心',[[50,89],[38,76],[25,61],[17,43],[21,25],[34,18],[45,26],[50,38]]],['燈籠',[[50,13],[37,13],[34,22],[24,31],[21,50],[24,70],[34,79],[38,88],[50,88]]],['雨傘',[[50,85],[42,76],[50,67],[50,31],[39,31],[31,38],[21,31],[31,18],[50,13]]],['茶杯',[[50,76],[32,76],[27,66],[27,42],[42,42],[45,28],[50,28]]],['房屋',[[50,15],[20,45],[27,45],[27,84],[41,84],[41,65],[50,65]]],['提袋',[[50,34],[43,20],[31,20],[25,34],[20,82],[50,82]]],['鈴鐺',[[50,18],[39,24],[34,39],[31,66],[22,77],[43,77],[45,87],[50,89]]],['果盤',[[50,28],[41,19],[34,25],[37,37],[20,49],[28,72],[42,83],[50,83]]]],geometry:[['星形',[[50,11],[41,38],[20,38],[37,55],[28,84],[50,66]]],['菱形',[[50,13],[18,50],[50,88],[40,50],[50,13]]],['六角形',[[50,14],[28,14],[17,50],[28,86],[50,86]]],['階梯',[[50,16],[39,16],[39,32],[29,32],[29,49],[19,49],[19,67],[34,67],[34,84],[50,84]]],['皇冠',[[50,78],[21,78],[25,30],[38,52],[50,19]]],['盾牌',[[50,14],[22,24],[25,56],[35,76],[50,89]]],['沙漏',[[50,13],[20,13],[39,50],[20,87],[50,87]]],['箭頭',[[50,22],[32,22],[18,50],[32,78],[50,78],[39,50],[50,22]]],['迴紋',[[50,19],[23,19],[23,81],[42,81],[42,36],[32,36],[32,66],[50,66]]]]};let seed=5;
const $=id=>document.getElementById(id),tx=(p,d)=>d==='vertical'?p:[p[1],p[0]];function shuffle(a){return a.map((v,i)=>[v,Math.sin(seed*997+i*619)*10000%1]).sort((a,b)=>a[1]-b[1]).map(x=>x[0])}function dots(){let s='';for(let i=0;i<36;i++){let x=12+(i%6)*15.2,y=12+Math.floor(i/6)*15.2;s+=`<circle cx="${x}" cy="${y}" r="1.2" class="dot"/>`}return s}
function render(){const d=$('direction').value,c=$('category').value,diff=$('difficulty').value,n=+$('count').value;const items=shuffle(P[c]).slice(0,n);$('sheet').className='worksheet count'+n;$('foot').textContent=({nature:'自然',life:'生活',geometry:'幾何'}[c])+'主題・'+(diff==='challenge'?'挑戰級':'進階級');$('grid').innerHTML=items.map((it,i)=>{const pts=it[1].map(p=>tx(p,d)),axis=d==='vertical'?'<line x1="50" y1="5" x2="50" y2="95" class="axis"/>':'<line x1="5" y1="50" x2="95" y2="50" class="axis"/>';return `<article class="exercise"><div class="etitle"><span>${i+1}</span>完成對稱的另一半</div><svg viewBox="0 0 100 100">${diff==='challenge'?dots():''}${axis}<polyline points="${pts.map(p=>p.join(',')).join(' ')}" class="line"/><circle cx="${pts[0][0]}" cy="${pts[0][1]}" r="2.1" class="start"/><text x="${pts[0][0]+3}" y="${pts[0][1]-2}" class="st">起點</text></svg><div class="label">${it[0]}・${d==='vertical'?'左右鏡像':'上下鏡像'}</div></article>`}).join('')}
['direction','category','difficulty','count'].forEach(id=>$(id).onchange=render);$('refresh').onclick=()=>{seed++;render()};render();
</script></body></html>
