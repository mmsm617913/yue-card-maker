<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff1c9">
<title>月來月好玩｜今天想怎麼玩？</title>
<style>
:root{--ink:#814757;--cream:#fff8df;--paper:#fffdf4;--coral:#f46970;--orange:#f3a640;--yellow:#ffd968;--blue:#76a8df;--teal:#65bea7;--purple:#9b80d1;--shadow:0 18px 40px rgba(125,69,73,.18)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;color:var(--ink)}
body{min-height:100svh;background:radial-gradient(circle at 8% 8%,#fff 0 4%,transparent 18%),radial-gradient(circle at 96% 11%,#ffc6b3 0 8%,transparent 25%),linear-gradient(145deg,#fff5cf,#ffe6c8 48%,#ffd9d8);overflow-x:hidden}
body:before,body:after{content:"✦";position:fixed;z-index:-1;color:#ef788055;font-size:44px}body:before{left:2vw;top:53vh}body:after{right:5vw;bottom:10vh}
.shell{width:min(1420px,94vw);margin:auto;padding:clamp(20px,3.2vw,46px) 0 24px}
header{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-bottom:clamp(20px,3vw,38px)}
.brand{display:flex;align-items:center;gap:18px}.moon{width:74px;height:74px;flex:0 0 auto;display:grid;place-items:center;border-radius:50%;font-size:42px;background:#fff3bd;border:3px solid #efb35f;box-shadow:0 10px 22px #b56b5c26}
.eyebrow{margin:0 0 5px;font-size:clamp(13px,1.3vw,18px);letter-spacing:.14em;font-weight:900;color:#b45e69}
h1{margin:0;font-size:clamp(35px,5vw,70px);line-height:1;color:#8b4657;letter-spacing:.04em}.topTag{padding:13px 22px;border:2px solid #eeb7aa;border-radius:999px;background:#fff8edcc;font-weight:900;color:#a55a66;box-shadow:0 8px 22px #9a556417}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:clamp(18px,2.6vw,38px)}
.choice{position:relative;min-height:600px;padding:clamp(23px,2.6vw,38px);border-radius:36px;background:var(--paper);border:4px solid var(--accent);box-shadow:var(--shadow),0 10px 0 var(--under);overflow:hidden;display:flex;flex-direction:column}
.choice:before{content:"";position:absolute;width:210px;height:210px;border-radius:50%;right:-78px;top:-78px;background:var(--wash)}
.choice.print{--accent:#efa644;--under:#d88635;--wash:#ffd86566}.choice.play{--accent:#ef6e79;--under:#ce5263;--wash:#84cdd05c}
.ribbon{position:relative;align-self:flex-start;margin:-7px 0 17px;padding:9px 18px;border-radius:999px;background:var(--accent);color:white;font-size:17px;font-weight:950;letter-spacing:.06em;box-shadow:0 7px 15px #8f4a5830}
.heroRow{display:grid;grid-template-columns:minmax(190px,.78fr) 1.25fr;gap:clamp(18px,2.4vw,34px);align-items:center;flex:1}
.art{height:360px;position:relative;border-radius:29px;background:linear-gradient(155deg,var(--art1),var(--art2));overflow:hidden;box-shadow:inset 0 0 0 3px #ffffff86}
.print .art{--art1:#ffd66b;--art2:#f39c43}.play .art{--art1:#86b4e5;--art2:#887ed0}
.card{position:absolute;width:46%;aspect-ratio:1;border:7px solid white;border-radius:18px;background:white;box-shadow:0 14px 26px #70485436;display:grid;place-items:center;overflow:hidden}.card img{width:90%;height:90%;object-fit:contain}.card.c1{left:10%;top:20%;transform:rotate(-10deg)}.card.c2{right:10%;top:10%;transform:rotate(8deg)}.card.c3{left:27%;bottom:9%;transform:rotate(2deg)}
.play .card{border-radius:22px}.play .card:after{content:"?";position:absolute;right:7px;bottom:2px;font-size:22px;font-weight:950;color:#ef6e79}
.kicker{display:inline-block;padding:7px 13px;border-radius:999px;background:#fff0b9;color:#a56338;font-weight:900;font-size:14px}
h2{margin:13px 0 12px;font-size:clamp(30px,3.3vw,50px);line-height:1.08;color:#874656}
.desc{margin:0 0 17px;font-size:clamp(16px,1.45vw,21px);font-weight:800;line-height:1.7;color:#805e63}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}.chips span{padding:7px 11px;border-radius:999px;font-size:13px;font-weight:900;background:#fff;color:#8b5963;border:1px solid #ead6ce}
.modeGrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:4px 0 18px}.modeGrid span{padding:8px 10px;border-radius:12px;background:#fff0ee;color:#985466;font-size:13px;font-weight:900;border-left:5px solid var(--accent)}
.enter{min-height:70px;width:100%;border:0;border-radius:22px;background:linear-gradient(115deg,var(--accent),var(--button2));color:white;text-decoration:none;font-size:clamp(18px,1.7vw,25px);font-weight:950;letter-spacing:.04em;display:flex;align-items:center;justify-content:center;gap:12px;box-shadow:0 13px 22px #8b4e5b2d;transition:transform .13s ease,filter .13s ease}.print{--button2:#ef7f4f}.play{--button2:#788bd7}.enter:active{transform:translateY(3px) scale(.985);filter:brightness(.96)}.arrow{font-size:28px}
footer{display:flex;justify-content:space-between;align-items:center;padding:25px 8px 0;font-weight:850;color:#916572;font-size:14px}
@media(max-width:950px){.choices{grid-template-columns:1fr}.choice{min-height:auto}.heroRow{grid-template-columns:240px 1fr}.art{height:330px}}
@media(max-width:620px){.shell{width:min(94vw,560px);padding-top:18px}header{align-items:flex-start}.moon{width:58px;height:58px;font-size:33px}.topTag{display:none}.choice{padding:19px;border-radius:27px}.heroRow{grid-template-columns:1fr}.art{height:210px}.card{width:36%}.card.c1{left:17%;top:16%}.card.c2{right:17%;top:10%}.card.c3{left:32%;bottom:5%}.modeGrid{grid-template-columns:1fr 1fr}.enter{min-height:60px}footer{font-size:12px;gap:12px}}
</style>
</head>
<body>
<main class="shell">
<header>
  <div class="brand"><div class="moon">🌙</div><div><p class="eyebrow">月月課堂工具・樂齡互動卡牌</p><h1>今天想怎麼玩？</h1></div></div>
  <div class="topTag">月來月好玩 ✦ 四大主題</div>
</header>
<section class="choices" aria-label="選擇使用方式">
  <article class="choice print">
    <div class="ribbon">🖨️ 紙本卡牌準備</div>
    <div class="heroRow">
      <div class="art" aria-hidden="true">
        <div class="card c1"><img src="/yue-card-maker/balls/basketball.png" alt=""></div>
        <div class="card c2"><img src="/yue-card-maker/space-v2/saturn.webp" alt=""></div>
        <div class="card c3"><img src="/yue-card-maker/hakka/red-bean-ice.webp" alt=""></div>
      </div>
      <div>
        <span class="kicker">上課前先準備</span>
        <h2>卡牌列印</h2>
        <p class="desc">製作實體雙面卡牌與紙本題目，保留固定 A／B 面配置，日後補印也能繼續搭配。</p>
        <div class="chips"><span>🏀 運動球類</span><span>🌍 宇宙星球</span><span>🐼 真實動物</span><span>🍲 客家美食</span></div>
      </div>
    </div>
    <a class="enter" href="/yue-card-maker/print/">進入卡牌列印 <span class="arrow">→</span></a>
  </article>
  <article class="choice play">
    <div class="ribbon">🎉 螢幕＋實體卡牌</div>
    <div class="heroRow">
      <div class="art" aria-hidden="true">
        <div class="card c1"><img src="/yue-card-maker/animals-v2/parrot.webp" alt=""></div>
        <div class="card c2"><img src="/yue-card-maker/balls/soccer.png" alt=""></div>
        <div class="card c3"><img src="/yue-card-maker/space-v2/earth.webp" alt=""></div>
      </div>
      <div>
        <span class="kicker">投影幕／HDMI 電視</span>
        <h2>互動遊玩</h2>
        <p class="desc">老師在大螢幕隨機出題，叔叔阿姨使用手上的實體卡牌一起觀察、記憶與挑戰。</p>
        <div class="modeGrid"><span>① 看圖排牌</span><span>② 記憶挑戰</span><span>③ 哪一張變了</span><span>④ 翻面接龍</span><span>⑤ 找出變化</span><span>⑥ 分類挑戰</span></div>
      </div>
    </div>
    <a class="enter" href="/yue-card-maker/games/">進入互動遊玩 <span class="arrow">→</span></a>
  </article>
</section>
<footer><span>建議使用橫式畫面，投影幕與電視都能清楚操作</span><strong>設計者月月🌙</strong></footer>
</main>
<script>
(()=>{const C=window.AudioContext||window.webkitAudioContext;document.addEventListener("pointerdown",e=>{const a=e.target.closest("a.enter");if(!a||!C)return;try{const c=new C,o=c.createOscillator(),g=c.createGain();o.type="sine";o.frequency.setValueAtTime(520,c.currentTime);o.frequency.exponentialRampToValueAtTime(760,c.currentTime+.07);g.gain.setValueAtTime(.001,c.currentTime);g.gain.exponentialRampToValueAtTime(.11,c.currentTime+.01);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.09);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.1);setTimeout(()=>c.close(),180)}catch{}})})();
</script>
</body></html>
