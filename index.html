<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f7a8a6">
  <title>月來月好玩｜認知 × 樂齡 × 記憶</title>
  <style>
  *{box-sizing:border-box}body{margin:0;color:#654b55;font-family:"Noto Sans TC",system-ui,sans-serif;background:linear-gradient(135deg,#fff8ef,#ffe9e9 50%,#fff3e4);min-height:100vh}body:before{content:"☾  ✦  ☆  ☽  ✧  ☾";position:fixed;inset:0;font-size:8vw;line-height:2.2;word-spacing:10vw;color:#de9a9a14;transform:rotate(-10deg);pointer-events:none}.wrap{max-width:1180px;margin:auto;padding:24px}.hero,.panel{background:#fffdf9e8;border:1px solid #f1c4bd;border-radius:26px;box-shadow:0 12px 35px #b9686c18}.hero{text-align:center;padding:28px;margin-bottom:18px}.hero h1{margin:0;color:#c96f76;font-size:clamp(28px,4vw,48px)}.hero p{margin:8px 0 0;font-weight:700;color:#a17675}.panel{padding:22px;margin-bottom:18px}.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.tabs button,.btn,select{border:0;border-radius:15px;padding:12px 18px;font-weight:800;font-size:16px}.tabs button,select{background:#fff0ea;color:#9e656a;border:1px solid #efc3bc}.tabs button.on,.btn{background:linear-gradient(135deg,#f3a287,#e989a1);color:white;box-shadow:0 5px 15px #d67c8730}.btn.secondary{background:#fff0ea;color:#a15f68;border:1px solid #eeb8b4}.btn:active{transform:translateY(1px)}.note{font-size:14px;color:#8c7379}.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:18px}.card{aspect-ratio:1;border:5px solid var(--group,#e86b6b);border-radius:18px;background:white;position:relative;overflow:hidden}.mark{position:absolute;left:7px;top:7px;width:32px;height:32px;border-radius:10px;background:var(--group);color:#fff;display:grid;place-items:center;font-size:22px;font-weight:900;z-index:2}.art{position:absolute;inset:0;background-image:var(--sheet);background-size:300% 300%;background-position:var(--pos);background-repeat:no-repeat;transform:translateY(7%);clip-path:inset(0 0 7% 0)}.question{max-width:680px;margin:18px auto 0}.question .cards{gap:8px}.question .card{border-width:3px}.status{padding:10px 14px;background:#fff5e9;border-radius:13px;margin-top:12px}.printHead{display:none}
  .wrap{max-width:1080px;padding:30px 24px}.hero{padding:34px;margin-bottom:22px;position:relative;overflow:hidden}.hero:after{content:"✦";position:absolute;right:7%;top:-20px;font-size:100px;color:#edbdc329}.hero h1{font-size:clamp(32px,4vw,48px);letter-spacing:2px}.moon{display:inline-block;width:.72em;height:.72em;border-radius:50%;background:#cf7a83;box-shadow:inset .22em -.05em 0 .02em #fffdf9;vertical-align:.02em;margin-right:.18em}.panel{padding:28px;margin-bottom:22px}.controls{display:grid;gap:18px}.tabs{display:grid!important;grid-template-columns:repeat(3,1fr);gap:14px}.tabs button,.btn,select{min-height:50px;padding:14px 20px}.note{font-size:15px;line-height:1.8;margin:0}.cards{gap:14px;margin-top:10px}.mark{width:34px;height:34px;font-size:23px}.question{max-width:760px}
  @media(max-width:650px){.wrap{padding:14px 10px}.hero{padding:25px 12px}.hero h1{font-size:29px}.panel{padding:16px 12px}.tabs{gap:7px}.tabs button{padding:10px 5px;font-size:14px;min-height:44px}.row{gap:8px}.row label{width:100%}.row select{width:100%}.cards{gap:7px}.card{border-width:3px;border-radius:12px}.mark{width:25px;height:25px;font-size:17px;left:5px;top:5px}.btn{flex:1;padding:11px 9px;font-size:14px;min-height:44px}}
  @media print{body{background:white}.no-print,.hero{display:none!important}.wrap{padding:0;max-width:none}.panel{box-shadow:none;border:0;padding:0;margin:0}.printHead{display:block;text-align:center}.cards{width:174mm;height:174mm;margin:10mm auto;gap:3mm}.card{border-radius:4mm}.mark{width:8mm;height:8mm;font-size:5mm}.question{max-width:none}.question .cards{width:174mm;height:174mm}.status{display:none}@page{size:A4 portrait;margin:10mm}}
  </style>
</head>
<body><main class="wrap"><header class="hero"><h1><span class="moon" aria-hidden="true"></span>月來月好玩 <span aria-hidden="true">✦</span></h1><p>認知 × 樂齡 × 記憶</p></header>
<section class="panel no-print controls"><div class="tabs" id="tabs"><button data-theme="balls" class="on">🏀 運動球類</button><button data-theme="planets">🌍 宇宙星球</button><button data-theme="animals">🐼 真實動物</button></div><div class="row"><label>玩家組別　<select id="group"></select></label><button class="btn" id="shuffle">重新隨機配對</button><button class="btn secondary" id="side">切換至 B 面</button></div><p class="note">每組9張卡集中於一張A4，A、B面使用相同組別符號。雙面列印時，請選擇「沿長邊翻頁」。</p></section>
<section class="panel"><h2 class="printHead" id="printTitle"></h2><div class="cards" id="player"></div><div class="row no-print" style="justify-content:center;margin-top:18px"><button class="btn" onclick="window.print()">列印／另存 PDF</button></div></section>
<section class="panel"><div class="row no-print"><h2 style="margin-right:auto">老師題目卡</h2><select id="level"><option value="4">2×2 初階</option><option value="9" selected>3×3 進階</option></select><button class="btn" id="newQ">產生新題目</button></div><div class="question"><div class="cards" id="question"></div></div><p class="status no-print">2×2只使用完整九張玩家牌中的其中4張；3×3使用全部9張。</p></section>
</main><script>
const themes={balls:'assets/balls.jpg',planets:'assets/planets.jpg',animals:'assets/animals.jpg'};
const colors=['#e86868','#498bd8','#e5b62f','#51a86b','#ed8e43','#9669c8','#df6f9f','#39a8a0','#444'];const marks=['●','▲','★','◆','♥','✿','☀','☾','✦'];
let theme='balls',side='A',map=[4,7,1,8,2,6,0,5,3];const positions=['0% 0%','50% 0%','100% 0%','0% 50%','50% 50%','100% 50%','0% 100%','50% 100%','100% 100%'];
const group=document.querySelector('#group');colors.forEach((_,i)=>group.add(new Option(`第 ${i+1} 組`,i)));
function shuffle(a){for(let i=a.length-1;i;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function card(i,gi=+group.value){const e=document.createElement('div');e.className='card';e.style.setProperty('--group',colors[gi]);e.innerHTML=`<span class="mark">${marks[gi]}</span><span class="art" style="--sheet:url('${themes[theme]}');--pos:${positions[i]}"></span>`;return e}
function render(){const p=document.querySelector('#player');p.innerHTML='';let seq=side==='A'?[0,1,2,3,4,5,6,7,8]:map;seq.forEach(i=>p.append(card(i)));document.querySelector('#side').textContent=side==='A'?'切換至 B 面':'切換至 A 面';document.querySelector('#printTitle').textContent=`第 ${+group.value+1} 組｜${side} 面`;newQuestion()}
function newQuestion(){const n=+document.querySelector('#level').value,q=document.querySelector('#question');q.innerHTML='';q.style.gridTemplateColumns=n===4?'repeat(2,1fr)':'repeat(3,1fr)';let ids=shuffle([...Array(9).keys()]).slice(0,n);ids.forEach(id=>q.append(card(Math.random()<.5?id:map[id])))}
document.querySelector('#tabs').onclick=e=>{if(!e.target.dataset.theme)return;theme=e.target.dataset.theme;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b===e.target));render()};group.onchange=render;document.querySelector('#side').onclick=()=>{side=side==='A'?'B':'A';render()};document.querySelector('#shuffle').onclick=()=>{map=shuffle([...Array(9).keys()]);render()};document.querySelector('#newQ').onclick=newQuestion;document.querySelector('#level').onchange=newQuestion;render();
if('serviceWorker'in navigator){navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()))}
if('caches'in window){caches.keys().then(ks=>ks.forEach(k=>caches.delete(k)))}
</script></body></html>
